[package]
name = "xarxa"
version = "0.1.0"
edition = "2024"

[features]
default = [
    "std",
    "log",
    "auto-icmp-echo-reply",
    "icmp-error-handling",
    "medium-ethernet",
    "medium-ip",
    "ipv4",
    "ipv6",
    "raw",
    "udp",
    "tcp",
]
## Enable functionality that requires the Rust standard library: the
## `TunTapInterface` device, `iface::wait`, and `Instant::now()`.
std = ["dep:libc"]
## Support interfaces that send and receive Ethernet frames, with the link-layer
## machinery that goes with them (ARP, NDISC, the neighbor cache).
medium-ethernet = []
## Support interfaces that send and receive bare IP packets, without a link-layer
## header.
medium-ip = []
## Support IPv4 (and, with `medium-ethernet`, ARP).
ipv4 = []
## Support IPv6 (and, with `medium-ethernet`, NDISC).
ipv6 = []
## Raw sockets.
raw = []
## UDP sockets.
udp = []
## TCP sockets and listeners.
tcp = []
## Use the Reno congestion control algorithm on TCP sockets. Mutually exclusive
## with `tcp-cubic`; with neither, TCP does no congestion control.
tcp-reno = ["tcp"]
## Use the CUBIC congestion control algorithm on TCP sockets. Mutually exclusive
## with `tcp-reno`; with neither, TCP does no congestion control.
##
## CUBIC uses `f64` arithmetic, which is slow on targets without a double
## precision FPU and pulls in soft-float code. Prefer `tcp-reno` there.
tcp-cubic = ["tcp"]
## Send and receive the TCP timestamp option (RFC 7323).
tcp-timestamps = ["tcp"]
## Waker registration on sockets, for building `Future`s on top of the stack.
async = []
## Enable the `PacketMeta::id` field: an opaque number that travels with a packet
## through the whole stack, set by the driver on receive and by the application on
## send. Costs 4 bytes in every packet buffer.
packetmeta-id = []
## Enable the `PacketMeta::timestamp` and `PacketMeta::request_timestamp` fields, and
## `Interface::poll_tx_timestamp`: hardware timestamping of received and transmitted
## packets.
##
## Transmit timestamps are correlated back to the packet that produced them by
## `PacketMeta::id`, so this implies `packetmeta-id`.
packetmeta-timestamp = ["packetmeta-id"]
## Automatically reply to ICMP echo requests. Disable to handle echo requests
## yourself through a raw socket.
auto-icmp-echo-reply = []
## Deliver ICMP error messages (destination unreachable, packet too big, ...) to
## the TCP and UDP sockets whose packets provoked them — both errors received
## from the network and the destination-unreachable errors the stack generates
## itself when neighbor resolution (ARP/NDISC) fails. Disabling this also
## disables generating the latter.
icmp-error-handling = []
## Log with the `defmt` crate.
defmt = ["dep:defmt"]
## Log with the `log` crate.
log = ["dep:log"]

[dependencies]
document-features = "0.2.11"
bitflags = { version = "2", default-features = false }
byteorder = { version = "1", default-features = false }
libc = { version = "0.2", optional = true }
defmt = { version = "1", optional = true, features = ["ip_in_core"] }
log = { version = "0.4", optional = true }

[dev-dependencies]
env_logger = "0.11"
rand = "0.8"

[[example]]
name = "tuntap"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "udp"]

[[example]]
name = "tcp_server"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "tcp"]

[[example]]
name = "tcp_client"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "tcp"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
