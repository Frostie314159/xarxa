[package]
name = "xarxa"
version = "0.1.0"
edition = "2024"

[features]
default = ["std"]
std = ["dep:libc"]

[dependencies]
bitflags = { version = "2", default-features = false }
byteorder = { version = "1", default-features = false }
libc = { version = "0.2", optional = true }
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
rand = "0.8"

[[example]]
name = "tuntap"
required-features = ["std"]

[[example]]
name = "tcp_server"
required-features = ["std"]

[[example]]
name = "tcp_client"
required-features = ["std"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
