[package]
name = "xarxa"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
features = [
    "std",
    "log",
    "async",
    "icmp-ping-reply",
    "icmp-errors",
    "medium-ethernet",
    "medium-ip",
    "ipv4",
    "ipv6",
    "raw",
    "udp",
    "tcp",
    "tcp-listener",
    "dhcpv4",
    "dns",
    "mdns",
    "tcp-reno",
    "tcp-timestamps",
    "packetmeta-timestamp",
]

[features]
default = [
    "std",
    "log",
    "icmp-ping-reply",
    "icmp-errors",
    "medium-ethernet",
    "medium-ip",
    "ipv4",
    "ipv6",
    "raw",
    "udp",
    "tcp",
    "tcp-listener",
    "dhcpv4",
    "slaac",
    "dns",
]
## Enable functionality that requires the Rust standard library: the
## `TunTapInterface` device, `iface::wait`, and `Instant::now()`.
std = ["dep:libc"]
## Waker registration on sockets, for building `Future`s on top of the stack.
async = []

#! ### Protocol support
## Support interfaces that send and receive Ethernet frames, with the link-layer
## machinery that goes with them (ARP, NDISC, the neighbor cache).
medium-ethernet = []
## Support interfaces that send and receive bare IP packets, without a link-layer
## header.
medium-ip = []
## Support IPv4 (and, with `medium-ethernet`, ARP).
ipv4 = []
## Support IPv6 (and, with `medium-ethernet`, NDISC).
ipv6 = []
## Raw sockets.
raw = []
## UDP sockets.
udp = []
## TCP sockets.
tcp = []
## TCP listeners, for accepting incoming connections.
tcp-listener = ["tcp"]
## DHCPv4 client, built into the interface. Needs `ipv4` and `medium-ethernet`.
dhcpv4 = ["ipv4", "medium-ethernet"]
## IPv6 stateless address autoconfiguration (SLAAC). Needs `ipv6` and `medium-ethernet`.
slaac = ["ipv6", "medium-ethernet"]
## DNS client.
dns = ["udp"]
## Resolve `.local` names with multicast DNS in the DNS client.
mdns = ["dns"]
## Send and receive the TCP timestamp option (RFC 7323).
tcp-timestamps = ["tcp"]
## Automatically reply to pings (ICMP echo requests).
icmp-ping-reply = []
## Deliver incoming ICMP error messages (destination unreachable, packet too big, ...) to
## the sockets that provoked them.
icmp-errors = []

#! ### TCP congestion control
#! Enable one of these features to enable congestion control. No feature enabled means
#! no congestion control. You may enable at most one.
## Use the Reno congestion control algorithm on TCP sockets.
tcp-reno = ["tcp"]
## Use the CUBIC congestion control algorithm on TCP sockets. Warning: it uses `f64` arithmetic which can be slow and pull in soft-float code depending on the target.
tcp-cubic = ["tcp"]

#! ### Packet metadata
## Enable the `PacketMeta::id` field: an opaque number that travels with a packet
## through the whole stack.
packetmeta-id = []
## Enable the `PacketMeta::timestamp` and `PacketMeta::request_timestamp` fields, and
## `Interface::poll_tx_timestamp`.
##
## Transmit timestamps are correlated back to the packet that produced them by
## `PacketMeta::id`, so this implies `packetmeta-id`.
packetmeta-timestamp = ["packetmeta-id"]

#! ### Logging
## Log with the `log` crate.
log = ["dep:log"]
## Log with the `defmt` crate.
defmt = ["dep:defmt", "heapless/defmt"]
## Log every packet received and sent, decoded.
## Needs `log` or `defmt` to print anything.
packet-log = []

[dependencies]
document-features = "0.2.11"
bitflags = { version = "2", default-features = false }
byteorder = { version = "1", default-features = false }
heapless = { version = "0.9", default-features = false }
libc = { version = "0.2", optional = true }
defmt = { version = "1", optional = true, features = ["ip_in_core"] }
log = { version = "0.4", optional = true }

[dev-dependencies]
env_logger = "0.11"
rand = "0.8"

[[example]]
name = "tuntap"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "udp"]

[[example]]
name = "tcp_server"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "tcp-listener"]

[[example]]
name = "tcp_client"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "tcp"]

[[example]]
name = "dns"
required-features = ["std", "log", "medium-ethernet", "medium-ip", "ipv4", "ipv6", "dns"]

[[example]]
name = "dhcp"
required-features = ["std", "log", "medium-ethernet", "ipv4", "dhcpv4"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
